<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>扣款明细 - 旧店</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { font-size: 14px; color: #007aff; text-decoration: none; background: #e5e5ea; padding: 8px 12px; border-radius: 12px; font-weight: bold; }
        .header h1 { font-size: 20px; margin: 0; padding-right: 70px; }

        /* ================= 筛选栏 ================= */
        .filter-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
        }

        /* 第一行：日期选择 */
        .date-inputs {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        .date-inputs select {
            flex: 1;
            max-width: 160px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            background: #f5f5f7;
        }
        .date-inputs span { color: #86868b; font-size: 14px; }

        /* 第二行：旋钮 + 特定词条 */
        .extra-filters {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        /* ---------- 圆形旋钮 ---------- */
        .knob-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .knob-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .knob-stage:focus-visible { outline: 2px solid #007aff; outline-offset: 6px; border-radius: 40px; }

        .knob-dial {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            flex: 0 0 auto;
            background: linear-gradient(145deg, #ffffff, #ececf0);
            border: 1px solid #d8d8dd;
            box-shadow: inset 0 2px 6px rgba(255,255,255,.95), 0 4px 12px rgba(0,0,0,.08);
        }
        /* 内圈虚线装饰 */
        .knob-dial::before {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 1px dashed #dcdce1;
        }
        /* 顶部“全部”小刻度 */
        .knob-dial::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 3px;
            width: 2px;
            height: 6px;
            margin-left: -1px;
            border-radius: 2px;
            background: #c7c7cc;
        }

        .knob-hand {
            position: absolute;
            inset: 0;
            transform: rotate(0deg);
            transition: transform .42s cubic-bezier(.34, 1.56, .64, 1);
        }
        .knob-hand::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 5px;
            width: 18px;
            height: 18px;
            margin-left: -9px;
            border-radius: 50%;
            background: #007aff;
            box-shadow: 0 2px 6px rgba(0, 122, 255, .45);
        }

        .knob-label {
            font-size: 13px;
            font-weight: 600;
            color: #a1a1a6;
            padding: 6px 10px;
            border-radius: 20px;
            white-space: nowrap;
            transition: color .25s, background .25s;
            cursor: pointer;
        }
        .knob-label.active { color: #007aff; background: #eaf3ff; }

        .knob-status {
            font-size: 12px;
            color: #86868b;
            min-height: 16px;
        }

        /* ---------- 特定词条下拉 ---------- */
        .keyword-select {
            width: 100%;
            max-width: 220px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            background: #f5f5f7;
        }

        /* 第三行：按钮 */
        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        .filter-btn, .reset-btn {
            flex: 1;
            max-width: 160px;
            padding: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            border: none;
        }
        .filter-btn { background: #007aff; color: white; }
        .filter-btn:active { background: #005bb5; }
        .reset-btn { background: #e5e5ea; color: #1d1d1f; }

        /* 电脑端宽屏适配 */
        @media (min-width: 700px) {
            .filter-bar { flex-direction: row; flex-wrap: nowrap; }
            .date-inputs { width: auto; }
            .extra-filters { width: auto; }
            .action-buttons { width: auto; }
            .filter-btn, .reset-btn { padding: 10px 20px; max-width: none; }
        }

        .expense-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); }

        .expense-list { list-style: none; padding: 0; margin: 0; }
        .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px dashed #f0f0f0; font-size: 15px; }
        .expense-item:last-child { border-bottom: none; }
        .expense-memo { color: #1d1d1f; font-weight: 600; margin-bottom: 4px; }
        .expense-date { font-size: 12px; color: #a1a1a6; }
        .expense-amount { color: #ff3b30; font-weight: bold; font-size: 18px; }

        .no-expense { color: #a1a1a6; font-size: 14px; text-align: center; padding: 30px 0; }
    </style>
</head>
