<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>扣款明细 - 旧店</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { font-size: 14px; color: #007aff; text-decoration: none; background: #e5e5ea; padding: 8px 12px; border-radius: 12px; font-weight: bold; }
        .header h1 { font-size: 20px; margin: 0; padding-right: 70px; }

        /* ================= 新增的筛选栏 ================= */
        .filter-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); }
        .filter-bar select { flex: 1; min-width: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; outline: none; background: #f5f5f7; }
        .filter-btn { background: #007aff; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .filter-btn:active { background: #005bb5; }
        .reset-btn { background: #e5e5ea; color: #1d1d1f; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }

        .expense-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); }
        
        .expense-list { list-style: none; padding: 0; margin: 0; }
        .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px dashed #f0f0f0; font-size: 15px; }
        .expense-item:last-child { border-bottom: none; }
        .expense-memo { color: #1d1d1f; font-weight: 600; margin-bottom: 4px; }
        .expense-date { font-size: 12px; color: #a1a1a6; }
        .expense-amount { color: #ff3b30; font-weight: bold; font-size: 18px; }
        
        .no-expense { color: #a1a1a6; font-size: 14px; text-align: center; padding: 30px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="back-btn">← 主页</a>
        <h1>💸 扣款明细</h1>
    </div>

    <!-- 日期查询筛选栏 -->
    <div class="filter-bar" id="filter-bar" style="display: none;">
        <select id="start-date"></select>
        <span style="color: #86868b; font-size: 14px;">至</span>
        <select id="end-date"></select>
        <button class="filter-btn" onclick="filterExpenses()">查询</button>
        <button class="reset-btn" onclick="resetExpenses()">重置</button>
    </div>

    <div class="expense-card">
        <ul class="expense-list" id="expense-list">
            <li class="no-expense">正在加载明细...</li>
        </ul>
    </div>
</div>

<script>
    let globalExpenses = []; // 存储原始数据

    // 日期解析辅助函数 (兼容 2026年10月19日 和 10月19日)
    function parseDateToTimestamp(dateStr) {
        const match = dateStr.match(/(?:(\d+)年)?(\d+)月(\d+)日/);
        if (match) {
            const year = match[1] ? Number(match[1]) : new Date().getFullYear();
            const month = Number(match[2]) - 1;
            const day = Number(match[3]);
            return new Date(year, month, day).getTime();
        }
        return 0;
    }

    // 渲染列表的函数（isAscending: true 为正序即旧到新，false 为降序即新到旧）
    function renderList(dataArray, isAscending = false) {
        const listEl = document.getElementById('expense-list');
        listEl.innerHTML = '';

        if (dataArray && dataArray.length > 0) {
            // 根据时间戳排序
            const sortedData = [...dataArray].sort((a, b) => {
                const timeA = parseDateToTimestamp(a.date);
                const timeB = parseDateToTimestamp(b.date);
                return isAscending ? timeA - timeB : timeB - timeA;
            });

            sortedData.forEach(item => {
                listEl.innerHTML += `
                    <li class="expense-item">
                        <div>
                            <div class="expense-memo">${item.memo}</div>
                            <span class="expense-date">${item.date}</span>
                        </div>
                        <div class="expense-amount">-$${Number(item.amount).toLocaleString()}</div>
                    </li>
                `;
            });
        } else {
            listEl.innerHTML = '<li class="no-expense">没有找到符合条件的扣款记录～</li>';
        }
    }

    // 初始化下拉框选项
    function initSelectOptions() {
        const startSel = document.getElementById('start-date');
        const endSel = document.getElementById('end-date');
        startSel.innerHTML = ''; endSel.innerHTML = '';

        // 提取所有不重复的日期并正序排列
        const uniqueDates = [...new Set(globalExpenses.map(item => item.date))];
        uniqueDates.sort((a, b) => parseDateToTimestamp(a) - parseDateToTimestamp(b));

        uniqueDates.forEach(date => {
            startSel.innerHTML += `<option value="${date}">${date}</option>`;
            endSel.innerHTML += `<option value="${date}">${date}</option>`;
        });

        // 默认起止日期选择最老和最新的一天
        if (uniqueDates.length > 0) {
            startSel.value = uniqueDates[0];
            endSel.value = uniqueDates[uniqueDates.length - 1];
        }
    }

    // 页面加载时拉取数据
    fetch('expenses.json')
        .then(response => response.json())
        .then(expenses => {
            if (expenses && expenses.length > 0) {
                globalExpenses = expenses;
                document.getElementById('filter-bar').style.display = 'flex';
                initSelectOptions();
                // 默认展示全部，降序排列（最新的在上）
                renderList(globalExpenses, false);
            } else {
                document.getElementById('expense-list').innerHTML = '<li class="no-expense">近期无扣款记录，大王很节约～</li>';
            }
        })
        .catch(err => {
            document.getElementById('expense-list').innerHTML = '<li class="no-expense">读取失败，请检查 expenses.json</li>';
        });

    // 点击查询
    function filterExpenses() {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;
        
        let startTs = parseDateToTimestamp(startDate);
        let endTs = parseDateToTimestamp(endDate);

        // 防呆：如果起始日期大于结束日期，交换它们
        if (startTs > endTs) {
            [startTs, endTs] = [endTs, startTs];
        }

        // 筛选出范围内的数据
        const filteredData = globalExpenses.filter(item => {
            const ts = parseDateToTimestamp(item.date);
            return ts >= startTs && ts <= endTs;
        });

        // 渲染查询结果（正序排列：旧到新）
        renderList(filteredData, true);
    }

    // 点击重置
    function resetExpenses() {
        initSelectOptions();
        // 恢复默认展示全部，降序排列（最新的在上）
        renderList(globalExpenses, false);
    }
</script>

</body>
</html>
