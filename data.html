<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当日营业额 - 橘耗鸽大王</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; position: relative; }
        /* 返回主页按钮 */
        .back-btn { position: absolute; left: 0; top: 5px; color: #007aff; text-decoration: none; font-weight: bold; font-size: 16px; }
        .upload-btn { background: #007aff; color: white; padding: 12px 24px; border-radius: 20px; cursor: pointer; display: inline-block; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 12px rgba(0,122,255,0.3); margin-top: 15px;}
        .upload-btn:hover { background: #005bb5; transform: translateY(-2px); }
        input[type="file"] { display: none; }
        
        /* 偷懒提示区 */
        .empty-state { text-align: center; padding: 60px 20px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-top: 20px; }
        .empty-state h2 { font-size: 24px; color: #86868b; font-weight: 500; line-height: 1.5; }
        .empty-state .emoji { font-size: 60px; margin-bottom: 20px; }

        /* 数据展示区 (默认隐藏) */
        .data-content { display: none; } 
        .cards { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; flex: 1; min-width: 250px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .card p { margin: 0; color: #86868b; font-size: 14px; }
        .number { font-size: 42px; font-weight: 700; color: #1d1d1f; margin-top: 10px; }
        .number.blue { color: #007aff; }
        .chart-container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: 350px; }
        .status { text-align: center; margin-top: 10px; color: #86868b; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="back-btn">← 返回主页</a>
        <h1>📊 当日营业额</h1>
        <label class="upload-btn">
            导入 Excel 账单
            <input type="file" id="excel-upload" accept=".xlsx, .xls">
        </label>
        <div class="status" id="status-text"></div>
    </div>

    <!-- 没上传数据时显示的偷懒提示 -->
    <div id="empty-state" class="empty-state">
        <div class="emoji">🦤💤</div>
        <h2 id="lazy-text">橘耗鸽大王正在偷懒，稍安勿躁哦～</h2>
    </div>

    <!-- 上传成功后显示的数据区 -->
    <div id="data-content" class="data-content">
        <div class="cards">
            <div class="card">
                <p>今日营业额汇总</p>
                <div class="number" id="total-amount">0</div>
            </div>
            <div class="card">
                <p>账户余额</p>
                <div class="number blue" id="balance-amount">0</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>
</div>

<script>
    // 随机显示一句偷懒的话
    const lazyTexts = [
        "橘耗鸽大王正在偷懒，稍安勿躁哦～",
        "橘耗鸽大王正在偷吃，饮茶先啦～"
    ];
    document.getElementById('lazy-text').innerText = lazyTexts[Math.floor(Math.random() * lazyTexts.length)];

    const ctx = document.getElementById('myChart').getContext('2d');
    let myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['第1天', '第2天', '第3天', '第4天', '第5天', '第6天', '第7天'],
            datasets: [{
                label: '每日营业额走势',
                data: [0, 0, 0, 0, 0, 0, 0], // 一开始全是0
                backgroundColor: 'rgba(0, 122, 255, 0.6)',
                borderRadius: 8
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const easeOutQuart = 1 - Math.pow(1 - progress, 4);
            const current = Math.floor(easeOutQuart * (end - start) + start);
            obj.innerHTML = '¥ ' + current.toLocaleString();
            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                obj.innerHTML = '¥ ' + (isNaN(end) ? 0 : end).toLocaleString();
            }
        };
        window.requestAnimationFrame(step);
    }

    document.getElementById('excel-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('status-text').innerText = "大王正在计算中...";
        const reader = new FileReader();

        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];

            const cellC28 = worksheet['C28'] ? worksheet['C28'].v : 0;
            const cellH28 = worksheet['H28'] ? worksheet['H28'].v : 0;

            // 隐藏偷懒提示，显示数据区
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('data-content').style.display = 'block';

            animateValue("total-amount", 0, Number(cellC28), 1500);
            animateValue("balance-amount", 0, Number(cellH28), 1500);

            document.getElementById('status-text').innerText = "✅ 读取成功！";
        };
        reader.readAsArrayBuffer(file);
    });
</script>

</body>
</html>
