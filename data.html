<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当日营业额 - 橘耗鸽大王</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 20px; margin: 0; min-height: 100vh; position: relative; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; position: relative; }
        .back-btn { position: absolute; left: 0; top: 5px; color: #007aff; text-decoration: none; font-weight: bold; font-size: 16px; }
        
        .empty-state { text-align: center; padding: 60px 20px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-top: 20px; }
        .empty-state h2 { font-size: 24px; color: #86868b; font-weight: 500; line-height: 1.5; }
        .empty-state .emoji { font-size: 60px; margin-bottom: 20px; }

        .data-content { display: none; } 
        .cards { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; flex: 1; min-width: 250px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .card p { margin: 0; color: #86868b; font-size: 14px; }
        .number { font-size: 42px; font-weight: 700; color: #1d1d1f; margin-top: 10px; }
        .number.blue { color: #007aff; }
        .chart-container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: 350px; }

        /* 🐭 鼠道悬浮按钮 */
        .floating-btn { position: fixed; right: 30px; bottom: 30px; background: #333; color: white; padding: 12px 20px; border-radius: 30px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s; z-index: 10; }
        .floating-btn:hover { background: #555; transform: translateY(-3px); }

        /* 弹窗遮罩与内容 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; }
        .modal-box h3 { margin-top: 0; font-size: 20px; color: #1d1d1f; margin-bottom: 20px; }
        .modal-box input { width: 90%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; margin-bottom: 20px; outline: none; }
        .modal-box input:focus { border-color: #007aff; }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .modal-btns button { padding: 10px 20px; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-confirm { background: #007aff; color: white; }
        .btn-cancel { background: #e5e5ea; color: #1d1d1f; }
        .error-msg { color: #ff3b30; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="back-btn">← 返回主页</a>
        <h1>📊 当日营业额</h1>
    </div>

    <!-- 没数据时显示的提示 -->
    <div id="empty-state" class="empty-state">
        <div class="emoji">🦤💤</div>
        <h2 id="lazy-text">橘耗鸽大王正在偷懒，稍安勿躁哦～</h2>
    </div>

    <!-- 数据展示区 -->
    <div id="data-content" class="data-content">
        <div class="cards">
            <div class="card">
                <p>今日营业额汇总</p>
                <div class="number" id="total-amount">0</div>
            </div>
            <div class="card">
                <p>账户余额</p>
                <div class="number blue" id="balance-amount">0</div>
            </div>
        </div>
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>
</div>

<!-- 🐭 鼠道按钮 -->
<button class="floating-btn" id="mouse-path-btn">🐭 鼠道</button>

<!-- 密码弹窗 -->
<div class="modal-overlay" id="password-modal">
    <div class="modal-box">
        <h3>鼠道艰险，粮草如何运送？</h3>
        <input type="password" id="password-input" placeholder="请输入暗号">
        <div class="error-msg" id="error-msg">暗号不对！大王不让你进！</div>
        <div class="modal-btns">
            <button class="btn-cancel" id="cancel-btn">退下</button>
            <button class="btn-confirm" id="confirm-btn">有何不敢！</button>
        </div>
    </div>
</div>

<!-- 隐藏的真正文件上传框 -->
<input type="file" id="excel-upload" accept=".xlsx, .xls" style="display: none;">

<script>
    // 偷懒文案
    const lazyTexts = ["橘耗鸽大王正在偷懒，稍安勿躁哦～", "橘耗鸽大王正在偷吃，饮茶先啦～"];
    document.getElementById('lazy-text').innerText = lazyTexts[Math.floor(Math.random() * lazyTexts.length)];

    // 初始化图表
    const ctx = document.getElementById('myChart').getContext('2d');
    let myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['第1天', '第2天', '第3天', '第4天', '第5天', '第6天', '第7天'],
            datasets: [{ label: '每日营业额走势', data: [0,0,0,0,0,0,0], backgroundColor: 'rgba(0, 122, 255, 0.6)', borderRadius: 8 }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 动画函数
    function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const current = Math.floor((1 - Math.pow(1 - progress, 4)) * (end - start) + start);
            obj.innerHTML = '¥ ' + current.toLocaleString();
            if (progress < 1) window.requestAnimationFrame(step);
            else obj.innerHTML = '¥ ' + (isNaN(end) ? 0 : end).toLocaleString();
        };
        window.requestAnimationFrame(step);
    }

    // 显示数据的函数
    function showData(c28, h28) {
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('data-content').style.display = 'block';
        animateValue("total-amount", 0, Number(c28), 1500);
        animateValue("balance-amount", 0, Number(h28), 1500);
    }

    // 🚀 页面加载时，检查本地是否有保存过数据
    const savedC28 = localStorage.getItem('savedC28');
    const savedH28 = localStorage.getItem('savedH28');
    if (savedC28 && savedH28) {
        showData(savedC28, savedH28);
    }

    // 🐭 弹窗逻辑
    const modal = document.getElementById('password-modal');
    const pwdInput = document.getElementById('password-input');
    const errorMsg = document.getElementById('error-msg');
    const fileInput = document.getElementById('excel-upload');

    document.getElementById('mouse-path-btn').onclick = () => {
        modal.style.display = 'flex';
        pwdInput.value = '';
        errorMsg.style.display = 'none';
    };

    document.getElementById('cancel-btn').onclick = () => {
        modal.style.display = 'none';
    };

    document.getElementById('confirm-btn').onclick = () => {
        // 验证密码
        if (pwdInput.value === '有何不敢！') {
            modal.style.display = 'none';
            fileInput.click(); // 密码正确，唤起文件选择框
        } else {
            errorMsg.style.display = 'block';
            pwdInput.value = '';
        }
    };

    // 处理文件上传
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            
            const cellC28 = worksheet['C28'] ? worksheet['C28'].v : 0;
            const cellH28 = worksheet['H28'] ? worksheet['H28'].v : 0;

            // 存入浏览器本地缓存
            localStorage.setItem('savedC28', cellC28);
            localStorage.setItem('savedH28', cellH28);

            // 展示数据
            showData(cellC28, cellH28);
        };
        reader.readAsArrayBuffer(file);
    });
</script>

</body>
</html>
