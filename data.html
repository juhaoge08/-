<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>营业额明细 - 橘耗鸽大王</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .back-btn { position: absolute; left: 0; top: 5px; color: #007aff; text-decoration: none; font-weight: bold; font-size: 16px; }
        
        /* 偷懒提示区 */
        .empty-state { text-align: center; padding: 60px 20px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .empty-state h2 { font-size: 24px; color: #86868b; font-weight: 500; line-height: 1.5; }
        .empty-state .emoji { font-size: 60px; margin-bottom: 20px; }

        .data-content { display: none; } 
        
        .cards { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { background: white; flex: 1; min-width: 250px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .card p { margin: 0; color: #86868b; font-size: 14px; }
        .number { font-size: 42px; font-weight: 700; color: #1d1d1f; margin-top: 10px; }
        .number.blue { color: #007aff; }

        /* 按钮组 */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 1px solid #d2d2d7; color: #1d1d1f; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .tab-btn:hover { background: #f5f5f7; }
        .tab-btn.active { background: #007aff; color: white; border-color: #007aff; }

        /* 自由对比选择区 (默认隐藏) */
        .custom-compare { display: none; justify-content: center; gap: 10px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .custom-compare select { padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; outline: none; }
        .compare-btn { background: #34c759; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .chart-container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: 350px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="back-btn">← 返回主页</a>
        <h1>📊 当日营业额</h1>
    </div>

    <!-- 偷懒提示 -->
    <div id="empty-state" class="empty-state" style="display: none;">
        <div class="emoji">🦤💤</div>
        <h2 id="lazy-text">橘耗鸽大王正在偷懒，稍安勿躁哦～</h2>
    </div>

    <!-- 数据展示区 -->
    <div id="data-content" class="data-content">
        <div class="cards">
            <div class="card">
                <p id="kpi-date-title">今日营业额</p>
                <div class="number" id="total-amount">0</div>
            </div>
            <div class="card">
                <p>当日账户余额</p>
                <div class="number blue" id="balance-amount">0</div>
            </div>
        </div>

        <!-- 预设按钮 -->
        <div class="tabs">
            <button class="tab-btn" onclick="changeChart('today', this)">只看今天</button>
            <button class="tab-btn active" onclick="changeChart('7days', this)">近7天对比</button>
            <button class="tab-btn" onclick="changeChart('month', this)">本月对比</button>
            <button class="tab-btn" onclick="toggleCustomCompare(this)">自由选择日期</button>
        </div>

        <!-- 自由对比下拉框 -->
        <div class="custom-compare" id="custom-compare-panel">
            <select id="date-select-1"></select>
            <span style="line-height: 35px;">对比</span>
            <select id="date-select-2"></select>
            <button class="compare-btn" onclick="doCustomCompare()">生成图表</button>
        </div>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>
</div>

<script>
    // 偷懒话术
    const lazyTexts = [
        "橘耗鸽大王正在偷懒，稍安勿躁哦～",
        "橘耗鸽大王正在偷吃，饮茶先啦～",
        "今天的数据还没上传，大王正在催账中..."
    ];
    document.getElementById('lazy-text').innerText = lazyTexts[Math.floor(Math.random() * lazyTexts.length)];

    const ctx = document.getElementById('myChart').getContext('2d');
    let myChart = new Chart(ctx, {
        type: 'bar',
        data: { labels: [], datasets: [{ label: '营业额', data: [], backgroundColor: 'rgba(0, 122, 255, 0.6)', borderRadius: 8 }] },
        options: { responsive: true, maintainAspectRatio: false }
    });

    let globalData = []; 

    function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const current = Math.floor((1 - Math.pow(1 - progress, 4)) * (end - start) + start);
            obj.innerHTML = '$ ' + current.toLocaleString();
            if (progress < 1) window.requestAnimationFrame(step);
            else obj.innerHTML = '$ ' + (isNaN(end) ? 0 : end).toLocaleString();
        };
        window.requestAnimationFrame(step);
    }

    // 获取系统当前日期（格式：10月24日）
    const today = new Date();
    const currentMonthStr = (today.getMonth() + 1) + '月';
    const currentDayStr = currentMonthStr + today.getDate() + '日';

    // 读取数据
    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            if (!data || data.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                return;
            }
            
            globalData = data;
            const latestDay = data[data.length - 1];

            // 【核心校验】判断最新一条数据是不是今天
            if (latestDay.date !== currentDayStr) {
                // 不是今天，显示偷懒
                document.getElementById('empty-state').style.display = 'block';
                return; 
            }

            // 是今天，正常展示
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('data-content').style.display = 'block';

            document.getElementById('kpi-date-title').innerText = latestDay.date + ' 营业额';
            animateValue("total-amount", 0, Number(latestDay.revenue), 1500);
            animateValue("balance-amount", 0, Number(latestDay.balance), 1500);

            // 初始化下拉框选项（倒序排列）
            initSelectOptions();

            // 默认渲染近7天
            changeChart('7days', document.querySelector('.tab-btn.active'));
        })
        .catch(error => {
            document.getElementById('empty-state').style.display = 'block';
        });

    // 初始化日期下拉框
    function initSelectOptions() {
        const sel1 = document.getElementById('date-select-1');
        const sel2 = document.getElementById('date-select-2');
        sel1.innerHTML = '';
        sel2.innerHTML = '';
        
        // 倒序遍历，让最近的日期在上面
        for (let i = globalData.length - 1; i >= 0; i--) {
            const date = globalData[i].date;
            sel1.innerHTML += `<option value="${date}">${date}</option>`;
            sel2.innerHTML += `<option value="${date}">${date}</option>`;
        }
        // 默认让下拉框选中最新的和倒数第二新的
        if (globalData.length >= 2) {
            sel1.selectedIndex = 1; // 倒数第二天
            sel2.selectedIndex = 0; // 最新一天
        }
    }

    // 切换图表
    function changeChart(type, btnElement) {
        // 隐藏自由对比面板
        document.getElementById('custom-compare-panel').style.display = 'none';
        
        // 处理按钮高亮
        if (btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        let chartData = [];

        if (type === 'today') {
            chartData = [globalData[globalData.length - 1]];
        } else if (type === '7days') {
            chartData = globalData.slice(-7);
        } else if (type === 'month') {
            // 筛选属于当前月份的数据
            chartData = globalData.filter(item => item.date.startsWith(currentMonthStr));
            // 如果本月没数据（比如跨月第一天），就显示最新一天兜底
            if(chartData.length === 0) chartData = [globalData[globalData.length - 1]];
        }

        updateChartData(chartData);
    }

    // 点击“自由选择日期”按钮
    function toggleCustomCompare(btnElement) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        
        // 显示下拉框面板
        document.getElementById('custom-compare-panel').style.display = 'flex';
    }

    // 执行自由对比
    function doCustomCompare() {
        const date1 = document.getElementById('date-select-1').value;
        const date2 = document.getElementById('date-select-2').value;
        
        // 在账本里找出这两天的数据
        const data1 = globalData.find(item => item.date === date1);
        const data2 = globalData.find(item => item.date === date2);

        // 把这两天的数据丢进图表
        let compareData = [];
        if(data1) compareData.push(data1);
        if(data2 && date1 !== date2) compareData.push(data2); // 防止选了同一天

        // 按日期排序
        compareData.sort((a, b) => new Date(a.date) - new Date(b.date));

        updateChartData(compareData);
    }

    // 刷新图表数据
    function updateChartData(dataArray) {
        myChart.data.labels = dataArray.map(item => item.date);
        myChart.data.datasets[0].data = dataArray.map(item => item.revenue);
        myChart.update();
    }
</script>

</body>
</html>
