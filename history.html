<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史汇总 - 橘耗鸽大王</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; position: relative; }
        .back-btn { position: absolute; left: 0; top: 5px; color: #007aff; text-decoration: none; font-weight: bold; font-size: 16px; }
        
        .empty-state { text-align: center; padding: 60px 20px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .empty-state h2 { font-size: 24px; color: #86868b; font-weight: 500; line-height: 1.5; }
        .empty-state .emoji { font-size: 60px; margin-bottom: 20px; }

        .data-content { display: none; } 
        
        /* 筛选栏 */
        .filter-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .filter-bar select { padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; outline: none; }
        .compare-btn { background: #007aff; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .compare-btn:hover { background: #005bb5; }

        /* 图例说明 */
        .legend { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; font-size: 13px; color: #86868b; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.max { background-color: #ff9500; }
        .dot.min { background-color: #d1d1d6; }
        .dot.normal { background-color: rgba(0, 122, 255, 0.6); }

        .chart-container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: 350px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="back-btn">← 返回主页</a>
        <h1>📅 历史账单汇总</h1>
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <div class="emoji">📭</div>
        <h2>暂无历史记录，大王还在努力搬砖～</h2>
    </div>

    <div id="data-content" class="data-content">
        <!-- 日期选择 -->
        <div class="filter-bar">
            <span>从</span>
            <select id="start-date"></select>
            <span>到</span>
            <select id="end-date"></select>
            <button class="compare-btn" onclick="filterHistory()">查询</button>
        </div>

        <!-- 图例 -->
        <div class="legend">
            <div class="legend-item"><span class="dot max"></span> 营业额最高</div>
            <div class="legend-item"><span class="dot min"></span> 营业额最低</div>
            <div class="legend-item"><span class="dot normal"></span> 普通营业日</div>
        </div>

        <!-- 小图表 -->
        <div class="chart-container" style="height: 250px;">
            <canvas id="historyChart"></canvas>
        </div>
    </div>
</div>

<script>
    const ctx = document.getElementById('historyChart').getContext('2d');
    let historyChart = new Chart(ctx, {
        type: 'bar',
        data: { 
            labels: [], 
            datasets: [{ 
                label: '营业额', 
                data: [], 
                backgroundColor: [], // 颜色会在后面动态填充
                borderRadius: 6 
            }] 
        },
        options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: { legend: { display: false } } // 隐藏默认图例
        }
    });

    let globalData = []; 

    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            if (!data || data.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                return;
            }
            globalData = data;
            document.getElementById('data-content').style.display = 'block';

            // 初始化下拉框
            const startSel = document.getElementById('start-date');
            const endSel = document.getElementById('end-date');
            startSel.innerHTML = ''; endSel.innerHTML = '';

            // 按时间正序填充（最老的日期在最上面）
            globalData.forEach(item => {
                startSel.innerHTML += `<option value="${item.date}">${item.date}</option>`;
                endSel.innerHTML += `<option value="${item.date}">${item.date}</option>`;
            });

            // 默认：开始日期是第一天，结束日期是最后一天
            startSel.selectedIndex = 0;
            endSel.selectedIndex = globalData.length - 1;

            // 第一次渲染全量数据
            renderHistoryChart(globalData);
        })
        .catch(error => {
            document.getElementById('empty-state').style.display = 'block';
        });

    // 点击查询按钮
    function filterHistory() {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;
        
        // 找到索引
        let startIdx = globalData.findIndex(item => item.date === startDate);
        let endIdx = globalData.findIndex(item => item.date === endDate);

        // 防呆：如果起始日期晚于结束日期，交换一下
        if (startIdx > endIdx) [startIdx, endIdx] = [endIdx, startIdx];

        // 截取区间数据
        const filteredData = globalData.slice(startIdx, endIdx + 1);
        renderHistoryChart(filteredData);
    }

    // 渲染图表的核心逻辑
    function renderHistoryChart(dataArray) {
        const labels = dataArray.map(item => item.date);
        const revenues = dataArray.map(item => item.revenue);

        // 计算极值
        const maxRev = Math.max(...revenues);
        const minRev = Math.min(...revenues);

        // 为每一天分配颜色
        const bgColors = revenues.map(val => {
            if (val === maxRev) return '#ff9500'; // 最高亮橙色
            if (val === minRev) return '#d1d1d6'; // 最低灰掉
            return 'rgba(0, 122, 255, 0.6)';      // 普通蓝色
        });

        historyChart.data.labels = labels;
        historyChart.data.datasets[0].data = revenues;
        historyChart.data.datasets[0].backgroundColor = bgColors;
        historyChart.update();
    }
</script>
</body>
</html>
