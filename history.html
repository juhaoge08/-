<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>历史汇总 - 旧店</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { font-size: 14px; color: #007aff; text-decoration: none; background: #e5e5ea; padding: 8px 12px; border-radius: 12px; font-weight: bold; }
        .header h1 { font-size: 20px; margin: 0; padding-right: 70px; }

        .empty-state { text-align: center; padding: 50px 20px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .empty-state h2 { font-size: 20px; color: #86868b; font-weight: 500; line-height: 1.5; margin-top: 15px; }
        .empty-state .emoji { font-size: 50px; }

        .data-content { display: none; } 
        
        /* 筛选栏 */
        .filter-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.04); }
        .filter-bar select { flex: 1; min-width: 120px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; outline: none; background: #f5f5f7; }
        .compare-btn { width: 100%; background: #007aff; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; }

        /* ================= 新增的查询日历区 ================= */
        .calendar-section { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); margin-bottom: 15px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; color: #1d1d1f; font-size: 15px;}
        .arrow-btn { background: none; border: none; font-size: 16px; color: #007aff; cursor: pointer; padding: 5px 15px; border-radius: 8px; transition: 0.2s; }
        .arrow-btn:hover { background: #f5f5f7; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .weekday { font-size: 12px; color: #86868b; margin-bottom: 5px; }
        .day-cell { font-size: 14px; padding: 6px 0; border-radius: 8px; color: #1d1d1f; }
        .day-cell.empty { visibility: hidden; }
        .day-cell.in-range { background: #e5f0ff; color: #007aff; font-weight: bold; } /* 范围高亮 */
        .day-cell.start-end { background: #007aff; color: white; border-radius: 50%; } /* 起止日高亮 */

        /* 图例 */
        .legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; font-size: 12px; color: #86868b; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.max { background-color: #ff9500; }
        .dot.min { background-color: #d1d1d6; }
        .dot.normal { background-color: rgba(0, 122, 255, 0.6); }

        .chart-container { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); height: 280px; margin-bottom: 10px; }
        
        .stats-info { text-align: center; font-size: 16px; color: #1d1d1f; font-weight: 500; min-height: 20px; padding: 10px 0; line-height: 1.6; }
        .stats-info span { color: #007aff; font-weight: 700; font-size: 18px; }

        @media (min-width: 500px) {
            .filter-bar select { width: auto; flex: none; }
            .compare-btn { width: auto; }
            .header h1 { padding-right: 0; }
            .chart-container { height: 350px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <a href="index.html" class="back-btn">← 主页</a>
        <h1>📅 历史汇总</h1>
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <div class="emoji">📭</div>
        <h2>暂无历史记录，大王还在努力搬砖～</h2>
    </div>

    <div id="data-content" class="data-content">
        <div class="filter-bar">
            <select id="start-date"></select>
            <span style="color: #86868b; font-size: 14px;">至</span>
            <select id="end-date"></select>
            <button class="compare-btn" onclick="filterHistory()">查询数据</button>
        </div>

        <!-- 查询日历展示区 -->
        <div class="calendar-section">
            <div class="calendar-header">
                <button class="arrow-btn" onclick="changeMonth(-1)">◀</button>
                <span id="calendar-title">加载中...</span>
                <button class="arrow-btn" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- JS 动态生成 -->
            </div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="dot max"></span> 营业额最高</div>
            <div class="legend-item"><span class="dot min"></span> 营业额最低</div>
            <div class="legend-item"><span class="dot normal"></span> 普通营业日</div>
        </div>

        <div class="chart-container">
            <canvas id="historyChart"></canvas>
        </div>

        <div class="stats-info" id="stats-display"></div>
    </div>
</div>

<script>
    const ctx = document.getElementById('historyChart').getContext('2d');
    let historyChart = new Chart(ctx, {
        type: 'bar',
        data: { labels: [], datasets: [{ label: '营业额', data: [], backgroundColor: [], borderRadius: 4 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });

    let globalData = []; 
    const statsDisplay = document.getElementById('stats-display');

    // 日历相关变量
    let currentCalDate = new Date(); // 当前日历显示的月份
    let filterStartObj = null;       // 当前查询的起始日期对象
    let filterEndObj = null;         // 当前查询的结束日期对象

    // 解析日期字符串为对象 (兼容 2026年10月19日 和 10月19日)
    function parseDateToObj(dateStr) {
        const match = dateStr.match(/(?:(\d+)年)?(\d+)月(\d+)日/);
        if (match) {
            return {
                year: match[1] ? Number(match[1]) : new Date().getFullYear(),
                month: Number(match[2]) - 1, // JS中月份是 0-11
                day: Number(match[3])
            };
        }
        return null;
    }

    // ★ 新增：格式化日期显示（今年不显示年份，往年显示年份）
    function formatDateForDisplay(dateStr) {
        const dateObj = parseDateToObj(dateStr);
        if (!dateObj) return dateStr;
        
        const currentYear = new Date().getFullYear();
        if (dateObj.year === currentYear) {
            return `${dateObj.month + 1}月${dateObj.day}日`;
        } else {
            return `${dateObj.year}年${dateObj.month + 1}月${dateObj.day}日`;
        }
    }

    // 渲染日历
    function renderCalendar() {
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        document.getElementById('calendar-title').innerText = `${year}年${month + 1}月`;
        
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '<div class="weekday">日</div><div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div>';
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        // 补全月初的空白
        for(let i=0; i<firstDay; i++) {
            grid.innerHTML += `<div class="day-cell empty"></div>`;
        }
        
        let startTs = filterStartObj ? new Date(filterStartObj.year, filterStartObj.month, filterStartObj.day).getTime() : null;
        let endTs = filterEndObj ? new Date(filterEndObj.year, filterEndObj.month, filterEndObj.day).getTime() : null;

        // 填充日期
        for(let i=1; i<=daysInMonth; i++) {
            let cellTs = new Date(year, month, i).getTime();
            let classes = 'day-cell';
            
            // 判断是否在查询范围内
            if (startTs !== null && endTs !== null) {
                if (cellTs >= startTs && cellTs <= endTs) {
                    classes += ' in-range';
                    // 如果是起始或结束日
                    if (cellTs === startTs || cellTs === endTs) {
                        classes += ' start-end';
                    }
                }
            }
            grid.innerHTML += `<div class="${classes}">${i}</div>`;
        }
    }

    // 切换月份
    function changeMonth(offset) {
        currentCalDate.setMonth(currentCalDate.getMonth() + offset);
        renderCalendar();
    }

    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            if (!data || data.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                return;
            }
            globalData = data;
            document.getElementById('data-content').style.display = 'block';

            const startSel = document.getElementById('start-date');
            const endSel = document.getElementById('end-date');
            startSel.innerHTML = ''; endSel.innerHTML = '';

            globalData.forEach(item => {
                // ★ 下拉框的值保留原样，但显示的文字应用智能格式化
                const displayDate = formatDateForDisplay(item.date);
                startSel.innerHTML += `<option value="${item.date}">${displayDate}</option>`;
                endSel.innerHTML += `<option value="${item.date}">${displayDate}</option>`;
            });

            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth(); // 0-11

            // ★ 核心修改：本月筛选必须同时匹配年份和月份
            let monthData = globalData.filter(item => {
                const dObj = parseDateToObj(item.date);
                return dObj && dObj.year === currentYear && dObj.month === currentMonth;
            });

            let defaultStartDate, defaultEndDate;

            // 如果有本月数据，默认显示本月首尾
            if (monthData.length > 0) {
                defaultStartDate = monthData[0].date;
                defaultEndDate = monthData[monthData.length - 1].date;
            } else {
                // 如果本月没数据，默认显示所有数据的首尾
                defaultStartDate = globalData[0].date;
                defaultEndDate = globalData[globalData.length - 1].date;
            }

            let sIdx = globalData.findIndex(item => item.date === defaultStartDate);
            let eIdx = globalData.findIndex(item => item.date === defaultEndDate);
            
            // 防呆
            if (sIdx > eIdx) {
                defaultEndDate = monthData[monthData.length - 1].date;
                eIdx = globalData.findIndex(item => item.date === defaultEndDate);
            }

            startSel.value = defaultStartDate;
            endSel.value = defaultEndDate;

            // 更新日历的状态
            filterStartObj = parseDateToObj(defaultStartDate);
            filterEndObj = parseDateToObj(defaultEndDate);
            if (filterStartObj) {
                currentCalDate = new Date(filterStartObj.year, filterStartObj.month, 1); // 日历跳到起始月份
            }

            renderCalendar();
            renderHistoryChart(globalData.slice(sIdx, eIdx + 1));
        })
        .catch(error => {
            document.getElementById('empty-state').style.display = 'block';
        });

    function filterHistory() {
        const startDate = document.getElementById('start-date').value;
        const endDate = document.getElementById('end-date').value;
        let startIdx = globalData.findIndex(item => item.date === startDate);
        let endIdx = globalData.findIndex(item => item.date === endDate);
        
        if (startIdx > endIdx) {
            [startIdx, endIdx] = [endIdx, startIdx];
            document.getElementById('start-date').value = endDate;
            document.getElementById('end-date').value = startDate;
        }

        // 点击查询时，更新日历状态
        filterStartObj = parseDateToObj(document.getElementById('start-date').value);
        filterEndObj = parseDateToObj(document.getElementById('end-date').value);
        
        // 让日历自动跳到起始日期的月份
        if (filterStartObj) {
            currentCalDate = new Date(filterStartObj.year, filterStartObj.month, 1);
        }
        renderCalendar();

        renderHistoryChart(globalData.slice(startIdx, endIdx + 1));
    }

    function renderHistoryChart(dataArray) {
        // ★ 图表 X 轴标签应用智能格式化
        const labels = dataArray.map(item => formatDateForDisplay(item.date));
        const revenues = dataArray.map(item => item.revenue);
        const maxRev = Math.max(...revenues);
        const minRev = Math.min(...revenues);

        const bgColors = revenues.map(val => {
            if (val === maxRev) return '#ff9500';
            if (val === minRev) return '#d1d1d6';
            return 'rgba(0, 122, 255, 0.6)';
        });

        historyChart.data.labels = labels;
        historyChart.data.datasets[0].data = revenues;
        historyChart.data.datasets[0].backgroundColor = bgColors;
        historyChart.update();

        if (dataArray.length > 0) {
            let total = 0;
            dataArray.forEach(item => {
                total += Number(item.revenue);
            });
            const avg = Math.round(total / dataArray.length);
            
            statsDisplay.innerHTML = `所选日期总营业额: <span>$${total.toLocaleString()}</span><br>所选日期平均营业额: <span>$${avg.toLocaleString()}</span>`;
        } else {
            statsDisplay.innerHTML = '';
        }
    }
</script>
</body>
</html>
