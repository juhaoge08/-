<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>营业额与金额查询 - 旧店</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 15px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        /* 顶部余额卡片 */
        .top-balance { 
            background: linear-gradient(135deg, #007aff, #00c6ff); color: white; width: 100%; max-width: 600px; padding: 25px 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,122,255,0.3); text-align: center; margin-top: 10px; margin-bottom: 30px; position: relative; 
            overflow: hidden; /* 让裂纹不溢出卡片圆角 */
        }
        .top-balance p { margin: 0; font-size: 14px; opacity: 0.9; letter-spacing: 1px; transition: color 0.3s; position: relative; z-index: 2; }
        .top-balance p.crit-text { color: #ff3b30; font-weight: bold; opacity: 1; }
        
        .top-balance h2 { margin: 10px 0 0 0; font-size: clamp(28px, 8vw, 48px); font-weight: bold; white-space: nowrap; display: inline-block; transition: transform 0.1s ease; position: relative; z-index: 2; }
        .top-balance h2.pop { transform: scale(1.15); color: #ffeb3b; }

        /* 卡片被撞毁的坍塌动画 */
        .top-balance.smashed {
            animation: collapseCard 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            border: 3px solid #ff3b30;
            box-shadow: 0 20px 50px rgba(255, 59, 48, 0.5);
            z-index: 1;
        }
        
        /* 撞击瞬间卡片内文字的震动 */
        .top-balance.smashed h2, .top-balance.smashed p {
            transform: rotate(-6deg) scale(0.95);
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes collapseCard {
            0% { transform: rotate(0deg) translate(0, 0) scale(1); }
            15% { transform: rotate(-8deg) translate(-15px, -20px) scale(1.1, 0.8); }
            40% { transform: rotate(18deg) translate(25px, 40px) scale(0.95, 1.05); }
            70% { transform: rotate(8deg) translate(15px, 25px) scale(1.02, 0.98); }
            100% { transform: rotate(12deg) translate(15px, 35px) scale(1); }
        }

        /* 震动动画 (用于普通暴击扣款) */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-3px, -2px) rotate(-1deg); }
            20% { transform: translate(-5px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; }

        .menu-container { width: 100%; max-width: 600px; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 25px; color: #1d1d1f; }
        
        /* 按钮列表 */
        .menu-grid { display: flex; gap: 15px; justify-content: center; flex-direction: column; }
        .menu-card { background: white; width: 100%; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; color: #1d1d1f; box-shadow: 0 8px 20px rgba(0,0,0,0.04); transition: all 0.2s ease; border: 2px solid transparent; }
        .menu-card:active { transform: scale(0.98); background: #fafafa; }
        .icon { font-size: 35px; margin-bottom: 8px; }
        .title { font-size: 18px; font-weight: 600; }
        .subtitle { font-size: 13px; color: #86868b; margin-top: 5px; }

        .tips-text { color: #a1a1a6; font-size: 13px; margin-top: 30px; letter-spacing: 1px; }

        /* ================= 裂纹图层 ================= */
        .crack-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            animation: crackAppear 0.4s ease-out forwards;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.55));
        }
        @keyframes crackAppear {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ================= 金钱粒子 ================= */
        .money-particle {
            position: fixed;
            pointer-events: none;
            z-index: 10001;
            font-size: 24px;
            line-height: 1;
            will-change: transform, opacity;
            animation: moneyFall 1.8s cubic-bezier(0.35, 0.05, 0.65, 1) forwards;
        }
        .money-particle.bag {
            font-size: 36px;
            animation-duration: 2.2s;
            filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.95));
        }
        @keyframes moneyFall {
            0%   { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(0.4); }
            10%  { opacity: 1; transform: translate(0, -18px) rotate(25deg) scale(1.12); }
            100% { opacity: 0; transform: translate(var(--drift), var(--fall)) rotate(var(--spin)) scale(0.85); }
        }

        /* ================= 悬浮窗橘子与气泡 ================= */
        .floating-mascot-container { position: fixed; bottom: 30px; right: 20px; z-index: 9999; }
        
        .mascot { 
            font-size: 65px; 
            cursor: pointer; 
            user-select: none; 
            display: inline-block; 
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25)); 
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.1s ease; 
        }
        
        /* 短按按住时的压扁反馈 */
        .mascot.pressing {
            transform: scale(1.3, 0.6) translateY(15px); 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); 
        }

        /* 动漫气泡对话框 */
        .speech-bubble {
            position: absolute; bottom: 85px; right: 10px; background-color: #ffffff; color: #1d1d1f; padding: 12px 18px; border-radius: 16px; border: 2px solid #1d1d1f; font-size: 15px; font-weight: 600; white-space: nowrap; box-shadow: 0 4px 15px rgba(0,0,0,0.1); opacity: 0; transform: translateY(10px) scale(0.8); transform-origin: bottom right; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 10000;
        }
        .speech-bubble.show { opacity: 1; transform: translateY(0) scale(1); }
        .speech-bubble::after { content: ''; position: absolute; bottom: -10px; right: 25px; border-width: 10px 10px 0; border-style: solid; border-color: #1d1d1f transparent transparent transparent; }
        .speech-bubble::before { content: ''; position: absolute; bottom: -7px; right: 27px; border-width: 8px 8px 0; border-style: solid; border-color: #ffffff transparent transparent transparent; z-index: 1; }

        /* 暴击飘字特效 (红) */
        .crit-float {
            position: fixed; color: #ff3b30; font-weight: 900; font-size: 28px;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
            pointer-events: none; animation: critUp 2s ease-out forwards; z-index: 10000;
            text-align: center; width: 100%; left: 0; top: 100px;
        }
        .crit-float span { display: block; font-size: 14px; color: #333; margin-top: 5px; text-shadow: none; font-weight: bold; }

        /* 回血飘字特效 (绿) */
        .heal-float {
            position: fixed; color: #34c759; font-weight: 900; font-size: 28px;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
            pointer-events: none; animation: critUp 2s ease-out forwards; z-index: 10000;
            text-align: center; width: 100%; left: 0; top: 100px;
        }
        .heal-float span { display: block; font-size: 14px; color: #333; margin-top: 5px; text-shadow: none; font-weight: bold; }

        @keyframes critUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.5); }
            20% { opacity: 1; transform: translateY(0) scale(1.2); }
            40% { transform: translateY(-10px) scale(1); }
            80% { opacity: 1; transform: translateY(-40px) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }

        .minus-one { position: fixed; color: #ff3b30; font-weight: bold; font-size: 20px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 10000; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }

        @media (min-width: 500px) {
            .menu-grid { flex-direction: row; flex-wrap: wrap; }
            .menu-card { width: calc(33.33% - 10px); height: 160px; } 
            .floating-mascot-container { bottom: 50px; right: 50px; }
        }
    </style>
</head>
<body>

<audio id="soundPress" src="Ya1.mp3" preload="auto"></audio>
<audio id="soundRelease" src="Ya2.mp3" preload="auto"></audio>

<div class="top-balance" id="balance-card">
    <p id="balance-title">最新账户可用余额</p>
    <h2 id="home-balance">载入中...</h2>
</div>

<div class="menu-container">
    <h1>旧店（Bazar deseo）</h1>
    
    <div class="menu-grid">
        <a href="data.html" class="menu-card">
            <div class="icon">📈</div>
            <div class="title">昨日营业额</div>
            <div class="subtitle">看数据 & 图表</div>
        </a>
        <a href="history.html" class="menu-card">
            <div class="icon">📅</div>
            <div class="title">历史汇总</div>
            <div class="subtitle">查账本 & 极值</div>
        </a>
        <a href="expenses.html" class="menu-card">
            <div class="icon">💸</div>
            <div class="title">扣款明细</div>
            <div class="subtitle">日常支出流水</div>
        </a>
    </div>

    <p class="tips-text">Tips：更多功能，敬请期待（催我找人弄你）</p>
</div>

<div class="floating-mascot-container">
    <div class="speech-bubble" id="speechBubble">今天辛苦啦！</div>
    <div class="mascot" id="magic-mascot">🍊</div>
</div>

<script>
    let currentBalance = 0; 
    let displayedBalance = 0;        // 当前“屏幕上显示”的数字（用于滚动）
    let balanceAnimToken = 0;        // 数字滚动动画令牌，防止多个动画打架

    const balanceText = document.getElementById('home-balance');
    const balanceCard = document.getElementById('balance-card');
    const balanceTitle = document.getElementById('balance-title');
    
    const soundPress = document.getElementById('soundPress');
    const soundRelease = document.getElementById('soundRelease');

    // 手机端音频预解锁
    window.addEventListener('touchstart', function unlockAudio() {
        soundPress.play().then(() => { soundPress.pause(); soundPress.currentTime = 0; }).catch(()=>{});
        soundRelease.play().then(() => { soundRelease.pause(); soundRelease.currentTime = 0; }).catch(()=>{});
        window.removeEventListener('touchstart', unlockAudio);
    }, { once: true });

    function playAudio(audio) {
        if (!audio) return;
        audio.currentTime = 0;
        let playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => { console.log("音频播放被阻止:", error); });
        }
    }

    // ============ 数字滚动动画 ============
    function animateBalance(start, end, duration) {
        const token = ++balanceAnimToken;
        let startTimestamp = null;
        const step = (timestamp) => {
            if (token !== balanceAnimToken) return; // 被新动画接管，放弃
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const easeOutQuart = 1 - Math.pow(1 - progress, 4);
            const current = Math.floor((end - start) * easeOutQuart + start);
            
            displayedBalance = current;
            balanceText.innerText = '$' + current.toLocaleString();

            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                displayedBalance = end;
                balanceText.innerText = '$' + end.toLocaleString();
            }
        };
        window.requestAnimationFrame(step);
    }

    // ============ 扣款（带滚动） ============
    function deductBalance(amount, duration) {
        const target = Math.max(0, currentBalance - amount);
        if (target === currentBalance) return;
        currentBalance = target;
        animateBalance(displayedBalance, currentBalance, duration);
    }

    function parseDateToTimestamp(dateStr) {
        const match = dateStr.match(/(?:(\d+)年)?(\d+)月(\d+)日/);
        if (match) {
            const year = match[1] ? Number(match[1]) : new Date().getFullYear();
            const month = Number(match[2]);
            const day = Number(match[3]);
            return new Date(year, month - 1, day).getTime();
        }
        return 0;
    }

    Promise.all([
        fetch('data.json').then(res => res.json()).catch(() => []),
        fetch('expenses.json').then(res => res.json()).catch(() => [])
    ]).then(([data, expenses]) => {
        if (!data || data.length === 0) {
            balanceText.innerText = '暂无数据';
            return;
        }

        let lastBalanceIndex = -1;
        for (let i = data.length - 1; i >= 0; i--) {
            if (data[i].balance !== undefined && data[i].balance !== null && data[i].balance !== '') {
                lastBalanceIndex = i;
                break;
            }
        }

        let baseBalance = 0;
        let baseTimestamp = 0;

        if (lastBalanceIndex >= 0) {
            baseBalance = Number(data[lastBalanceIndex].balance);
            baseTimestamp = parseDateToTimestamp(data[lastBalanceIndex].date);
        }

        let additionalRevenue = 0;
        const startIndex = lastBalanceIndex >= 0 ? lastBalanceIndex + 1 : 0;
        for (let i = startIndex; i < data.length; i++) {
            additionalRevenue += Number(data[i].revenue || 0);
        }

        let additionalExpense = 0;
        if (expenses && expenses.length > 0) {
            expenses.forEach(exp => {
                const expTimestamp = parseDateToTimestamp(exp.date);
                if (lastBalanceIndex < 0 || expTimestamp > baseTimestamp) {
                    additionalExpense += Number(exp.amount || 0);
                }
            });
        }

        const currentRealBalance = baseBalance + additionalRevenue - additionalExpense;
        
        const lastRealBalStr = localStorage.getItem('last_real_balance');
        const lastExpenseFingerprint = localStorage.getItem('last_expense_fingerprint');
        
        let currentFingerprint = "";
        let latestMemo = "账目调整";
        if (expenses && expenses.length > 0) {
            const latestExp = expenses[expenses.length - 1];
            currentFingerprint = latestExp.date + "_" + latestExp.amount + "_" + latestExp.memo;
            latestMemo = latestExp.memo;
        }

        let startNum = 0; 

        if (lastRealBalStr !== null) {
            const lastRealBal = Number(lastRealBalStr);
            if (currentRealBalance > lastRealBal) {
                startNum = lastRealBal;
                const healAmount = currentRealBalance - lastRealBal;
                const healDiv = document.createElement('div');
                healDiv.className = 'heal-float';
                let reason = (currentFingerprint !== lastExpenseFingerprint && currentFingerprint !== "") ? "退款/调整" : "营业额增加";
                healDiv.innerHTML = `+$${healAmount.toLocaleString()}<span>${reason}</span>`;
                document.body.appendChild(healDiv);
                setTimeout(() => healDiv.remove(), 2000);
            } else if (currentRealBalance < lastRealBal) {
                startNum = lastRealBal;
                balanceCard.classList.add('shake');
                setTimeout(() => balanceCard.classList.remove('shake'), 600);
                balanceTitle.classList.add('crit-text');
                balanceTitle.innerText = "最新账户可用余额";
                const critDiv = document.createElement('div');
                critDiv.className = 'crit-float';
                let deductAmount = lastRealBal - currentRealBalance;
                let reason = (currentFingerprint !== lastExpenseFingerprint) ? latestMemo : "营业额调整/账目减少";
                critDiv.innerHTML = `-$${deductAmount.toLocaleString()}<span>${reason}</span>`;
                document.body.appendChild(critDiv);
                setTimeout(() => critDiv.remove(), 2000);
            }
        }

        animateBalance(startNum, currentRealBalance, 1500);

        localStorage.setItem('last_real_balance', currentRealBalance);
        if (currentFingerprint !== "") {
            localStorage.setItem('last_expense_fingerprint', currentFingerprint);
        }
        
        currentBalance = currentRealBalance; 
    }).catch(err => {
        balanceText.innerText = '读取失败';
    });


    // ================= 橘子长按物理跳跃系统 =================
    const mascot = document.getElementById('magic-mascot');
    const bubble = document.getElementById('speechBubble');
    let bubbleTimeout;

    const orangeQuotes = [
        "喵~",
        "别点我了！",
        "我要睡觉...",
        "今天赚大钱了吗？",
        "花了我一块钱，心疼...",
        "要不要来杯下午茶？",
        "生意兴隆，财源广进！"
    ];

    let pressStartTime = 0;
    let isPressing = false;
    let isAnimating = false;
    let hasSmashed = false; // 记录是否已经撞毁过卡片，防止重复触发

    let activePointerId = null;

    mascot.addEventListener('pointerdown', function(e) {
        if (isAnimating) return;
        isPressing = true;
        pressStartTime = Date.now();
        activePointerId = e.pointerId;
        try { mascot.setPointerCapture(e.pointerId); } catch (err) {}
        mascot.classList.add('pressing');
        mascot.style.transition = ''; 
        mascot.style.transform = '';  
        playAudio(soundPress); 
    });

    function releasePress(e) {
        if (!isPressing || isAnimating) return;
        isPressing = false;
        const pointerId = e.pointerId;
        activePointerId = null;
        try { mascot.releasePointerCapture(pointerId); } catch (err) {}
        mascot.classList.remove('pressing');

        const duration = Date.now() - pressStartTime;

        if (duration < 2000) {
            playAudio(soundRelease);
            executeMascotClick();
        } else if (duration < 8000) {
            mascot.style.transform = 'translateY(0px)'; 
            const jumpHeight = 100 + ((duration - 2000) / 6000) * 400; 
            performJump(jumpHeight, false);
        } else {
            mascot.style.transform = 'translateY(0px)';
            performJump(0, true);
        }
    }

    function cancelPress(pointerId) {
        if (!isPressing) return;
        isPressing = false;
        activePointerId = null;
        mascot.classList.remove('pressing');
        if (pointerId !== undefined && pointerId !== null) {
            try { mascot.releasePointerCapture(pointerId); } catch (err) {}
        }
    }

    document.addEventListener('pointerup', function(e) {
        if (!isPressing || isAnimating) return;
        if (activePointerId !== null && e.pointerId !== activePointerId) return;
        releasePress(e);
    });

    mascot.addEventListener('pointerup', function(e) {
        if (!isPressing || isAnimating) return;
        if (activePointerId !== null && e.pointerId !== activePointerId) return;
        releasePress(e);
    });

    mascot.addEventListener('pointercancel', function(e) {
        cancelPress(e.pointerId);
    });

    // ================= 物理跳跃引擎 =================
    function performJump(maxHeight, isSuper) {
        isAnimating = true;
        const startTime = performance.now();
        const g = 2500;

        mascot.style.transition = 'none';

        const cardRect = balanceCard.getBoundingClientRect();
        const mascotRect = mascot.getBoundingClientRect();
        const hitDistance = mascotRect.top - cardRect.bottom + 10; 

        let v0;
        let hitTime = 0;
        let hitY = 0;

        if (isSuper) {
            const neededHeight = hitDistance + window.innerHeight * 0.8;
            v0 = Math.sqrt(2 * g * neededHeight) + 100; 
        } else {
            v0 = Math.sqrt(2 * g * maxHeight);
        }

        function animate(currentTime) {
            const elapsed = currentTime - startTime;
            const t = elapsed / 1000;

            if (isSuper && hasSmashed) {
                const timeSinceHit = currentTime - hitTime;
                const flySpeed = 1.2;
                const flyY = hitY + (timeSinceHit * flySpeed);
                
                if (-flyY + mascotRect.top < -150) {
                    mascot.style.display = 'none';
                    isAnimating = false;
                    return; 
                }
                
                mascot.style.transform = `translateY(${-flyY}px) rotate(${(timeSinceHit / 3) % 360}deg)`;
                requestAnimationFrame(animate);
                return;
            }

            let y = v0 * t - 0.5 * g * t * t;
            
            if (isSuper && y >= hitDistance) {
                hasSmashed = true;
                hitTime = currentTime;
                hitY = y;
                triggerSmash();
                requestAnimationFrame(animate);
                return;
            }

            if (!isSuper && y < 0) {
                mascot.style.transform = `translateY(0px)`;
                triggerLanding();
                return;
            }

            let rotation = 0;
            if (isSuper) {
                rotation = (elapsed / 10) % 360;
            } else {
                rotation = y * 0.1; 
            }

            mascot.style.transform = `translateY(${-y}px) rotate(${rotation}deg)`;
            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    }

    function triggerLanding() {
        mascot.style.transform = `scale(1.4, 0.5) translateY(15px)`;
        playAudio(soundRelease);
        
        setTimeout(() => {
            mascot.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            mascot.style.transform = `scale(1, 1) translateY(0px)`;
            
            setTimeout(() => {
                mascot.style.transition = ''; 
                isAnimating = false;
            }, 400);
        }, 100);
    }

    // ================= 撞击：裂纹 + 掉钱 =================
    let crackOriginX = 0;        // 撞击点（相对卡片左侧）
    let impactScreenX = 0;       // 撞击点屏幕坐标
    let impactScreenY = 0;
    let drainActive = false;
    let drainIntervalId = null;
    let particleTimeoutId = null;

    function triggerSmash() {
        playAudio(soundPress);

        // ---- 计算撞击点（在加 .smashed 之前算，坐标才准）----
        const cardRect = balanceCard.getBoundingClientRect();
        const mascotRect = mascot.getBoundingClientRect();
        const w = balanceCard.clientWidth;

        let rawX = (mascotRect.left + mascotRect.width / 2) - cardRect.left;
        crackOriginX = Math.max(28, Math.min(w - 28, rawX));

        impactScreenX = cardRect.left + crackOriginX;
        impactScreenY = cardRect.top + cardRect.height - 6;

        // ---- 卡片坍塌 ----
        balanceCard.classList.add('smashed');
        balanceTitle.classList.add('crit-text');
        balanceTitle.innerText = "饿啊～～";

        // ---- 画裂纹 ----
        drawCracks();

        // ---- 开始掉钱 ----
        startMoneyDrain();
    }

    function drawCracks() {
        const old = balanceCard.querySelector('.crack-layer');
        if (old) old.remove();

        const w = balanceCard.clientWidth;
        const h = balanceCard.clientHeight;

        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'crack-layer');
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
        svg.setAttribute('preserveAspectRatio', 'none');

        const ix = crackOriginX;
        const iy = h - 4;

        const branches = 6 + Math.floor(Math.random() * 3);

        for (let b = 0; b < branches; b++) {
            const t = branches === 1 ? 0.5 : b / (branches - 1);
            // 从偏左下 → 正上 → 偏右下 扇开
            let angle = -Math.PI * 0.94 + t * Math.PI * 0.88;
            angle += (Math.random() - 0.5) * 0.28;

            const segCount = 4 + Math.floor(Math.random() * 4);
            const totalLen = h * (0.55 + Math.random() * 0.85);
            const segLen = totalLen / segCount;

            const pts = [[ix, iy]];
            let cx = ix, cy = iy;
            for (let s = 0; s < segCount; s++) {
                angle += (Math.random() - 0.5) * 0.55;
                cx += Math.cos(angle) * segLen;
                cy += Math.sin(angle) * segLen;
                pts.push([cx, cy]);
            }

            const poly = document.createElementNS(NS, 'polyline');
            poly.setAttribute('points', pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
            poly.setAttribute('fill', 'none');
            poly.setAttribute('stroke', b % 2 === 0 ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.75)');
            poly.setAttribute('stroke-width', b % 2 === 0 ? '2.2' : '1.3');
            poly.setAttribute('stroke-linecap', 'round');
            poly.setAttribute('stroke-linejoin', 'round');
            svg.appendChild(poly);
        }

        // 撞击点凹坑
        const pit = document.createElementNS(NS, 'circle');
        pit.setAttribute('cx', ix);
        pit.setAttribute('cy', iy);
        pit.setAttribute('r', '11');
        pit.setAttribute('fill', 'rgba(0,0,0,0.25)');
        svg.appendChild(pit);

        const core = document.createElementNS(NS, 'circle');
        core.setAttribute('cx', ix);
        core.setAttribute('cy', iy);
        core.setAttribute('r', '5');
        core.setAttribute('fill', 'rgba(255,255,255,0.4)');
        svg.appendChild(core);

        balanceCard.appendChild(svg);
    }

    // ================= 掉钱系统 =================
    function startMoneyDrain() {
        if (drainActive) return;
        drainActive = true;

        // 每 0.5 秒扣 1 块（滚动数字），直到余额归零
        drainIntervalId = setInterval(() => {
            if (currentBalance <= 0) {
                stopMoneyDrain();
                return;
            }
            deductBalance(1, 260);
        }, 500);

        // 每秒约 2~3 个金钱粒子，直到余额归零
        const spawnLoop = () => {
            if (!drainActive) return;
            if (currentBalance <= 0) { stopMoneyDrain(); return; }
            spawnMoneyParticle();
            particleTimeoutId = setTimeout(spawnLoop, 330 + Math.random() * 220);
        };
        spawnLoop();
    }

    function stopMoneyDrain() {
        drainActive = false;
        if (drainIntervalId) { clearInterval(drainIntervalId); drainIntervalId = null; }
        if (particleTimeoutId) { clearTimeout(particleTimeoutId); particleTimeoutId = null; }
    }

    function spawnMoneyParticle() {
        const isBag = Math.random() < (1 / 40); // 1/40 概率掉钱袋

        const el = document.createElement('div');
        el.className = 'money-particle' + (isBag ? ' bag' : '');
        el.textContent = isBag ? '💰' : (Math.random() < 0.5 ? '🪙' : '💵');

        const drift = (Math.random() - 0.5) * 190;
        const fall = window.innerHeight * (0.55 + Math.random() * 0.35);
        const spin = (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 540);

        el.style.left = (impactScreenX + (Math.random() - 0.5) * 70) + 'px';
        el.style.top = impactScreenY + 'px';
        el.style.setProperty('--drift', drift.toFixed(0) + 'px');
        el.style.setProperty('--fall', fall.toFixed(0) + 'px');
        el.style.setProperty('--spin', spin.toFixed(0) + 'deg');

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2600);

        if (isBag) {
            // 钱袋：扣 100 块（滚动），不显示额外说明文字
            deductBalance(100, 900);

            const bagDiv = document.createElement('div');
            bagDiv.className = 'crit-float';
            bagDiv.innerHTML = `-$100`;
            document.body.appendChild(bagDiv);
            setTimeout(() => bagDiv.remove(), 2000);

            playAudio(soundPress);
        }
    }

    // ================= 短按逻辑 =================
    function executeMascotClick() {
        if (currentBalance > 0) {
            deductBalance(1, 200);
            balanceText.classList.add('pop');
            setTimeout(() => { balanceText.classList.remove('pop'); }, 100); 
        }
        
        const minusOne = document.createElement('div');
        minusOne.className = 'minus-one';
        minusOne.innerText = '-$1';
        const rect = mascot.getBoundingClientRect();
        minusOne.style.left = (rect.left + rect.width / 2 - 15) + 'px';
        minusOne.style.top = (rect.top - 10) + 'px';
        document.body.appendChild(minusOne);
        setTimeout(() => { minusOne.remove(); }, 800);

        const randomQuote = orangeQuotes[Math.floor(Math.random() * orangeQuotes.length)];
        bubble.innerText = randomQuote;
        bubble.classList.add('show');
        clearTimeout(bubbleTimeout);
        bubbleTimeout = setTimeout(() => { bubble.classList.remove('show'); }, 3000);
    }
</script>
