<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺数据看板</title>
    <!-- 引入图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 引入Excel读取库 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .upload-btn { background: #007aff; color: white; padding: 12px 24px; border-radius: 20px; cursor: pointer; display: inline-block; font-weight: bold; transition: 0.3s; box-shadow: 0 4px 12px rgba(0,122,255,0.3); }
        .upload-btn:hover { background: #005bb5; transform: translateY(-2px); }
        input[type="file"] { display: none; }
        .cards { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; flex: 1; min-width: 250px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .card p { margin: 0; color: #86868b; font-size: 14px; }
        .number { font-size: 42px; font-weight: 700; color: #1d1d1f; margin-top: 10px; }
        .number.blue { color: #007aff; }
        .chart-container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: 350px; }
        .status { text-align: center; margin-top: 20px; color: #86868b; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 我的店铺数据看板</h1>
        <label class="upload-btn">
            点击这里导入 Excel 账单
            <input type="file" id="excel-upload" accept=".xlsx, .xls">
        </label>
        <div class="status" id="status-text">当前为演示数据，请上传Excel</div>
    </div>

    <div class="cards">
        <div class="card">
            <p>营业额汇总 (读取 C28)</p>
            <div class="number" id="total-amount">0</div>
        </div>
        <div class="card">
            <p>账户余额 (读取 H28)</p>
            <div class="number blue" id="balance-amount">0</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    // 初始化图表 (暂时保留演示数据)
    const ctx = document.getElementById('myChart').getContext('2d');
    let myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['第1天', '第2天', '第3天', '第4天', '第5天', '第6天', '第7天'],
            datasets: [{
                label: '每日营业额走势',
                data: [100, 200, 150, 300, 250, 400, 350],
                backgroundColor: 'rgba(0, 122, 255, 0.6)',
                borderRadius: 8
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 数字滚动动画函数
    function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const easeOutQuart = 1 - Math.pow(1 - progress, 4);
            const current = Math.floor(easeOutQuart * (end - start) + start);
            obj.innerHTML = '¥ ' + current.toLocaleString();
            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                // 如果读取不到数字，或者读出来是空的，就显示0
                obj.innerHTML = '¥ ' + (isNaN(end) ? 0 : end).toLocaleString();
            }
        };
        window.requestAnimationFrame(step);
    }

    // 监听文件上传
    document.getElementById('excel-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('status-text').innerText = "正在解析数据...";
        const reader = new FileReader();

        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            // 默认读取你表格里的第一个 Sheet
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];

            // 读取特定单元格：C28 和 H28
            const cellC28 = worksheet['C28'] ? worksheet['C28'].v : 0;
            const cellH28 = worksheet['H28'] ? worksheet['H28'].v : 0;

            // 触发动画更新数字
            animateValue("total-amount", 0, Number(cellC28), 1500);
            animateValue("balance-amount", 0, Number(cellH28), 1500);

            document.getElementById('status-text').innerText = "✅ 读取成功！文件：" + file.name;
        };
        reader.readAsArrayBuffer(file);
    });
</script>

</body>
</html>
