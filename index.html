<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>营业额与金额查询 - 旧店</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 15px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* 顶部余额卡片 */
        .top-balance { background: linear-gradient(135deg, #007aff, #00c6ff); color: white; width: 100%; max-width: 600px; padding: 25px 15px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,122,255,0.3); text-align: center; margin-top: 10px; margin-bottom: 30px; }
        .top-balance p { margin: 0; font-size: 14px; opacity: 0.9; letter-spacing: 1px; }
        
        .top-balance h2 { margin: 10px 0 0 0; font-size: clamp(28px, 8vw, 48px); font-weight: bold; white-space: nowrap; transition: transform 0.1s ease; display: inline-block; }
        .top-balance h2.pop { transform: scale(1.1); }

        .menu-container { width: 100%; max-width: 600px; text-align: center; }
        h1 { font-size: 22px; margin-bottom: 25px; color: #1d1d1f; }
        
        /* 按钮列表 */
        .menu-grid { display: flex; gap: 15px; justify-content: center; flex-direction: column; }
        .menu-card { background: white; width: 100%; padding: 25px; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; color: #1d1d1f; box-shadow: 0 8px 20px rgba(0,0,0,0.04); transition: all 0.2s ease; border: 2px solid transparent; }
        .menu-card:active { transform: scale(0.98); background: #fafafa; }
        .icon { font-size: 40px; margin-bottom: 10px; }
        .title { font-size: 18px; font-weight: 600; }
        .subtitle { font-size: 13px; color: #86868b; margin-top: 5px; }

        /* 新增的小字提示 */
        .tips-text { color: #a1a1a6; font-size: 13px; margin-top: 30px; letter-spacing: 1px; }

        /* ================= 悬浮窗吉祥物核心区 ================= */
        .floating-mascot-container {
            position: fixed; /* 固定定位，不随滚动条移动 */
            bottom: 30px;    /* 距离底部 30px */
            right: 20px;     /* 距离右侧 20px */
            z-index: 9999;   /* 保证它在最上层 */
        }
        
        .mascot {
            font-size: 65px; /* 吉祥物大小 */
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: inline-block;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.25)); /* 加深阴影，更有悬浮感 */
        }

        /* 点击压扁的 Q弹效果 */
        .mascot:active {
            transform: scale(1.3, 0.6) translateY(15px);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* 飘字特效（-$1） */
        .minus-one {
            position: fixed; /* 也改成固定定位，防止页面滚动时错位 */
            color: #ff3b30;
            font-weight: bold;
            font-size: 22px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 10000;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }

        /* 电脑端宽屏适配 */
        @media (min-width: 500px) {
            .menu-grid { flex-direction: row; }
            .menu-card { width: 240px; height: 180px; }
            .floating-mascot-container { bottom: 50px; right: 50px; }
        }
    </style>
</head>
<body>

<div class="top-balance" id="balance-card">
    <p>最新账户总余额</p>
    <h2 id="home-balance">载入中...</h2>
</div>

<div class="menu-container">
    <h1>旧店（Bazar deseo）</h1>
    
    <div class="menu-grid">
        <a href="data.html" class="menu-card">
            <div class="icon">📈</div>
            <div class="title">昨日营业额</div>
            <div class="subtitle">看数据 & 图表对比</div>
        </a>
        <a href="history.html" class="menu-card">
            <div class="icon">📅</div>
            <div class="title">历史汇总</div>
            <div class="subtitle">查账本 & 极值高亮</div>
        </a>
    </div>

    <!-- 新增的 Tips 小字 -->
    <p class="tips-text">Tips：更多功能，敬请期待（催我找人弄你）</p>
</div>

<!-- 悬浮窗吉祥物（目前是橘子） -->
<div class="floating-mascot-container">
    <!-- 以后想换别的，直接换掉这里的 🍊，比如换成 🦆 或者 <img src="图片链接"> -->
    <div class="mascot" id="magic-mascot">🍊</div>
</div>

<script>
    let currentBalance = 0; 

    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            if (data && data.length > 0) {
                const latestData = data[data.length - 1]; 
                currentBalance = Number(latestData.balance);
                document.getElementById('home-balance').innerText = '$' + currentBalance.toLocaleString();
            } else {
                document.getElementById('home-balance').innerText = '暂无数据';
            }
        })
        .catch(err => {
            document.getElementById('home-balance').innerText = '读取失败';
        });

    // 吉祥物点击交互
    const mascot = document.getElementById('magic-mascot');
    const balanceText = document.getElementById('home-balance');

    mascot.addEventListener('click', function(e) {
        if (currentBalance > 0) {
            currentBalance -= 1;
            balanceText.innerText = '$' + currentBalance.toLocaleString();
            
            balanceText.classList.add('pop');
            setTimeout(() => { balanceText.classList.remove('pop'); }, 100); 
        }

        // 飘字特效
        const minusOne = document.createElement('div');
        minusOne.className = 'minus-one';
        minusOne.innerText = '-$1';
        
        const rect = mascot.getBoundingClientRect();
        minusOne.style.left = (rect.left + rect.width / 2 - 15) + 'px';
        minusOne.style.top = (rect.top - 10) + 'px';
        
        document.body.appendChild(minusOne);

        setTimeout(() => { minusOne.remove(); }, 800);
    });
</script>

</body>
</html>
